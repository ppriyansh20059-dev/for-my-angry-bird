<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>for my angry bird 🎀 heheheh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --hot:#ff4fa3;
    --bubble:#ff8fc5;
    --blush:#ffd9ec;
    --cream:#fff6fb;
    --ink:#6b2a4d;
    --deep:#a81e63;
    --mint:#7ce0c0;
    --butter:#ffe08a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    font-family:'Quicksand',system-ui,sans-serif;
    color:var(--ink);
    background-color:#ffeaf5;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'><g fill='%23ffb3d8' opacity='.55'><path d='M16 26c-5-4-9-7-9-11a5 5 0 019-3 5 5 0 019 3c0 4-4 7-9 11z'/><path d='M48 54c-5-4-9-7-9-11a5 5 0 019-3 5 5 0 019 3c0 4-4 7-9 11z'/></g><g fill='%23ff8fc5' opacity='.35'><path d='M48 22c-3.5-2.8-6.3-4.9-6.3-7.7a3.5 3.5 0 016.3-2.1 3.5 3.5 0 016.3 2.1c0 2.8-2.8 4.9-6.3 7.7z'/><path d='M16 58c-3.5-2.8-6.3-4.9-6.3-7.7a3.5 3.5 0 016.3-2.1 3.5 3.5 0 016.3 2.1c0 2.8-2.8 4.9-6.3 7.7z'/></g></svg>");
    background-size:150px 150px;
    background-attachment:fixed;
    overflow-x:hidden;
  }
  body:before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(900px 600px at 20% 0%, rgba(255,255,255,.75), transparent 60%),
               radial-gradient(800px 600px at 85% 100%, rgba(255,120,185,.35), transparent 60%);
  }
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
  .wrap{position:relative;z-index:5;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:26px 16px 60px}
  .card{
    width:100%;max-width:620px;position:relative;
    background:var(--cream);
    border:3px solid var(--bubble);
    border-radius:32px;
    padding:34px 24px 30px;
    box-shadow:0 20px 60px rgba(214,51,132,.28), inset 0 0 0 7px #fff;
    text-align:center;
  }
  .card:before,.card:after{
    content:"";position:absolute;width:34px;height:34px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff, var(--bubble));
    box-shadow:0 3px 10px rgba(214,51,132,.3);
  }
  .card:before{top:-14px;left:26px}
  .card:after{top:-14px;right:26px}
  .screen{display:none;animation:pop .45s cubic-bezier(.2,1.5,.4,1) both}
  .screen.on{display:block}
  @keyframes pop{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
  h1{
    font-family:'Baloo 2',cursive;font-weight:800;
    font-size:clamp(27px,7vw,42px);line-height:1.1;margin:0 0 12px;
    color:var(--deep);
    text-shadow:2px 2px 0 #fff, 4px 4px 0 rgba(255,143,197,.6);
  }
  h2{font-family:'Baloo 2',cursive;font-weight:800;font-size:clamp(21px,5.2vw,30px);margin:0 0 12px;line-height:1.2;color:var(--deep)}
  p{font-size:clamp(15px,3.9vw,17.5px);line-height:1.6;margin:0 0 15px;font-weight:600}
  .small{font-size:12.5px;opacity:.6;margin-top:18px;font-weight:600}
  .bowtop{display:block;margin:0 auto 6px;width:clamp(74px,20vw,110px);height:auto;animation:bob 3s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-9px) rotate(4deg)}}
  .emoji{font-size:clamp(42px,12vw,64px);display:block;margin:0 0 8px;animation:bob 2.8s ease-in-out infinite}
  button{
    font-family:'Baloo 2',cursive;font-weight:800;font-size:18px;
    border:none;cursor:pointer;padding:14px 26px;border-radius:999px;color:#fff;
    background:linear-gradient(135deg,var(--bubble),var(--hot));
    box-shadow:0 6px 0 #d63384, 0 12px 26px rgba(214,51,132,.35);
    transition:transform .14s ease, box-shadow .14s ease;
  }
  button:hover{transform:translateY(-2px)}
  button:active{transform:translateY(3px);box-shadow:0 3px 0 #d63384}
  .ghost{background:#fff;color:var(--deep);border:2.5px solid var(--bubble);box-shadow:0 4px 0 rgba(255,143,197,.6);font-size:15px;padding:12px 20px}
  .stack{display:flex;flex-direction:column;gap:11px;margin-top:18px}
  .meter-val{font-family:'Baloo 2',cursive;font-weight:800;font-size:clamp(40px,12vw,62px);color:var(--hot);line-height:1}
  .meter-label{min-height:46px;font-size:clamp(14.5px,3.9vw,17px);font-weight:700;color:var(--deep);margin:8px 0 4px}
  input[type=range]{width:100%;margin:12px 0 4px;accent-color:var(--hot);height:34px}
  .hint{font-size:12.5px;opacity:.6;margin-top:6px;font-weight:600}
  .bar{height:18px;border-radius:999px;background:#ffe1f0;overflow:hidden;margin:18px 0 10px;border:2.5px solid var(--bubble)}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--butter),var(--hot),var(--mint));transition:width .3s ease}
  .load-text{font-size:15px;min-height:48px;font-weight:700}
  .receipt{
    background:#fff;border:2.5px dashed var(--bubble);border-radius:16px;
    padding:18px 16px;text-align:left;font-size:14px;line-height:1.75;
    box-shadow:0 10px 26px rgba(214,51,132,.18);margin:6px 0 16px;font-weight:600;
  }
  .receipt .r-h{font-family:'Baloo 2',cursive;font-weight:800;font-size:17px;text-align:center;margin-bottom:10px;color:var(--deep)}
  .receipt .row{display:flex;justify-content:space-between;gap:10px;border-bottom:1.5px dotted #ffc2e0;padding:3px 0}
  .receipt .tot{font-weight:800;color:var(--hot);border-bottom:none;padding-top:8px;font-size:15px}
  .choices{display:grid;gap:10px;margin-top:16px;text-align:left}
  .choices button{font-family:'Quicksand',sans-serif;font-weight:700;font-size:14.5px;text-align:left;
    background:#fff;color:var(--ink);border:2.5px solid var(--blush);box-shadow:0 4px 0 rgba(255,143,197,.45);padding:13px 15px;border-radius:18px}
  .choices button:hover{background:#fff0f8;border-color:var(--hot)}
  .q-box{position:relative;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;margin-top:10px}
  #yesBtn{
    background:linear-gradient(135deg,#ff6fb3,#ff2e8f);
    box-shadow:0 7px 0 #c2185b, 0 14px 30px rgba(214,51,132,.4);
    font-size:21px;padding:17px 36px;
    transition:transform .25s cubic-bezier(.2,1.6,.4,1), box-shadow .25s ease;will-change:transform;
  }
  #noBtn{
    position:relative;background:#fff;color:#c58aa9;border:2.5px solid #ffcce3;
    box-shadow:0 4px 0 #ffcce3;font-size:17px;padding:14px 28px;
    transition:transform .32s cubic-bezier(.2,1.4,.4,1), left .32s cubic-bezier(.2,1.4,.4,1), top .32s cubic-bezier(.2,1.4,.4,1), opacity .5s ease;
    will-change:left,top,transform;z-index:40;
  }
  #noBtn.loose{position:fixed}
  #taunt{min-height:28px;font-weight:800;color:var(--hot);font-size:15px;margin-top:4px}
  .final-emoji{font-size:clamp(50px,15vw,86px);display:block;animation:spin 4s ease-in-out infinite}
  @keyframes spin{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) scale(1.07)}}
  .chip{display:inline-block;background:#fff;border:2.5px solid var(--blush);color:var(--deep);
    border-radius:999px;padding:7px 14px;font-size:13px;font-weight:800;margin:4px 3px}
  .note{background:#fff;border:2.5px solid var(--blush);border-radius:20px;padding:16px 15px;margin-top:16px;font-size:15px;line-height:1.7;font-weight:600;text-align:left}
  .note p{margin:0 0 12px}
  .note p:last-child{margin:0}
  .marq{overflow:hidden;white-space:nowrap;margin:16px -24px -6px;opacity:.85}
  .marq span{display:inline-block;animation:slide 20s linear infinite;font-family:'Baloo 2',cursive;font-weight:800;font-size:15px;color:var(--hot);padding-right:40px}
  @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="wrap">
<div class="card">
  <section class="screen on" id="s0">
    <svg class="bowtop" viewBox="0 0 120 78" aria-hidden="true">
      <g>
        <path d="M54 39C40 18 12 12 8 26c-4 13 6 26 24 28-18 6-26 20-20 30 7 11 32 2 42-17z" fill="#ff4fa3"/>
        <path d="M66 39c14-21 42-27 46-13 4 13-6 26-24 28 18 6 26 20 20 30-7 11-32 2-42-17z" fill="#ff78bb"/>

    <div class="meter-label" id="angerLabel"></div>
    <input type="range" id="anger" min="0" max="10" value="5">
    <p class="hint" id="angerNote"></p>
    <div class="stack"><button data-go="s2" id="t-s1-btn"></button></div>

  <section class="screen" id="s2">
    <h2 id="t-s2-title"></h2>

  <section class="screen" id="s3">

    <div class="stack"><button id="afterLoad" data-go="s4" style="display:none"></button></div>
  </section>

  <section class="screen" id="s4">
    <h2 id="t-s4-title"></h2>
    <div class="receipt">
      <div class="r-h" id="t-s4-rh"></div>
      <div id="receiptRows"></div>
    </div>
    <p id="t-s4-terms"></p>
    <div class="stack"><button data-go="s5" id="t-s4-btn"></button></div>
  </section>

  <section class="screen" id="s5">
    <span class="emoji" id="t-s5-emoji"></span>
    <h1 id="t-s5-question"></h1>
    <p id="t-s5-sub" style="font-style:italic;opacity:.8"></p>
    <div class="q-box" id="qbox">
      <button id="yesBtn"></button>
      <button id="noBtn"></button>
      <div id="taunt"></div>
    </div>
    <div class="hint" id="t-s5-hint"></div>
  </section>

  <section class="screen" id="s6">
    <span class="final-emoji" id="t-s6-emoji"></span>
    <h1 id="t-s6-title"></h1>
    <p id="t-s6-p"></p>
    <div id="chips"></div>
    <div class="note" id="note"></div>
    <div class="stack"><button id="again" class="ghost"></button></div>
    <div class="marq"><span id="marqText"></span></div>
  </section>
</div>

/* ==========================================================================

(function(){
  "use strict";
  var T=TEXT;
  function set(id,val){ var el=document.getElementById(id); if(el) el.textContent=val; }

  /* ---------- paint all the words onto the page ---------- */
  document.title=T.pageTitle;

  set("t-s0-title",T.s0.title); set("t-s0-p1",T.s0.p1); set("t-s0-p2",T.s0.p2);
  set("t-s0-btnA",T.s0.btnA); set("t-s0-btnB",T.s0.btnB); set("t-s0-small",T.s0.small);

  set("t-s1-title",T.s1.title); set("t-s1-p",T.s1.p); set("t-s1-btn",T.s1.btn);

  set("t-s2-title",T.s2.title); set("t-s2-p",T.s2.p); set("t-s2-small",T.s2.small);
  var punish=document.getElementById("punish");
  T.s2.options.forEach(function(o){
    var b=document.createElement("button"); b.textContent=o; punish.appendChild(b);
  });

  set("t-s3-title",T.s3.title); set("afterLoad",T.s3.btn);
  set("loadText",T.s3.loading[0]);

  set("t-s4-title",T.s4.title); set("t-s4-rh",T.s4.receiptTitle);
  set("t-s4-terms",T.s4.terms); set("t-s4-btn",T.s4.btn);
  var rr=document.getElementById("receiptRows");
  function addRow(a,b,isTot){
    var d=document.createElement("div"); d.className="row"+(isTot?" tot":"");
    var l=document.createElement("span"); l.textContent=a;
    var r=document.createElement("span"); r.textContent=b;
    d.appendChild(l); d.appendChild(r); rr.appendChild(d);
  }
  T.s4.rows.forEach(function(row){ addRow(row[0],row[1],false); });
  addRow(T.s4.totalLabel,T.s4.totalValue,true);

  set("t-s5-emoji",T.s5.emoji); set("t-s5-question",T.s5.question);
  set("t-s5-sub",T.s5.sub); set("t-s5-hint",T.s5.hint);
  set("yesBtn",T.s5.yes); set("noBtn",T.s5.no);

  set("t-s6-emoji",T.s6.emoji); set("t-s6-title",T.s6.title); set("t-s6-p",T.s6.p);
  set("again",T.s6.btn);
  var chips=document.getElementById("chips");
  T.s6.chips.forEach(function(c){
    var s=document.createElement("span"); s.className="chip"; s.textContent=c; chips.appendChild(s);
  });
  var note=document.getElementById("note");
  T.s6.note.forEach(function(line){
    var p=document.createElement("p"); p.textContent=line; note.appendChild(p);
  });
  var mq=T.s6.marquee+" ";
  set("marqText", mq+mq);

  /* ---------- screens ---------- */
  var cur="s0";
  function show(id){
    var a=document.getElementById(cur), b=document.getElementById(id);
    if(!b) return;
    if(a) a.classList.remove("on");
    b.classList.add("on");
    cur=id; window.scrollTo(0,0);
    if(id==="s3") runLoader();
    if(id==="s5") setTimeout(function(){ taunt(T.s5.firstTaunt); },500);
    if(id==="s6") party();
  }
  document.addEventListener("click",function(e){
    var t=e.target.closest("[data-go]");
    if(t) show(t.getAttribute("data-go"));
  });

  /* ---------- anger meter ---------- */
  var ang=document.getElementById("anger");
  ang.max=T.s1.levels.length-1;
  ang.value=Math.floor((T.s1.levels.length-1)/2);
  function updAnger(){
    var v=+ang.value, lv=T.s1.levels[v];
    set("angerVal",v); set("angerLabel",lv.label); set("angerNote",lv.note);
  }
  ang.addEventListener("input",updAnger); updAnger();

  /* ---------- punishment ---------- */
  punish.addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    var txt=b.textContent.trim();
    b.style.background="linear-gradient(135deg,#ff6fb3,#ff2e8f)";
    b.style.color="#fff"; b.style.borderColor="#ff2e8f";
    b.textContent="✔ locked in: "+txt;
    setTimeout(function(){ show("s3"); },700);
  });

  /* ---------- loader ---------- */
  var ranLoader=false;
  function runLoader(){
    if(ranLoader) return; ranLoader=true;
    var i=0, fill=document.getElementById("barFill"), txt=document.getElementById("loadText");
    var t=setInterval(function(){
      txt.textContent=T.s3.loading[i];
      fill.style.width=Math.round(((i+1)/T.s3.loading.length)*100)+"%";
      i++;
      if(i>=T.s3.loading.length){ clearInterval(t); document.getElementById("afterLoad").style.display="block"; }
    },900);
  }

  /* ---------- the runaway no button ---------- */
  var no=document.getElementById("noBtn"), yes=document.getElementById("yesBtn"), tauntEl=document.getElementById("taunt");
  var dodges=0, MAX=T.s5.dodges||8, scale=1, yScale=1, gone=false;
  function taunt(s){ tauntEl.textContent=s; }

  function flee(e){
    if(gone) return;
    if(e){ e.preventDefault(); e.stopPropagation(); }
    dodges++;
    if(!no.classList.contains("loose")){
      var r=no.getBoundingClientRect();
      no.classList.add("loose");
      no.style.left=r.left+"px"; no.style.top=r.top+"px"; no.style.margin="0";
    }
    scale=Math.max(0.1, scale*0.76);
    yScale=Math.min(2.6, yScale*1.17);
    no.style.transform="scale("+scale+") rotate("+(Math.random()*50-25)+"deg)";
    yes.style.transform="scale("+yScale+")";
    yes.style.boxShadow="0 "+(7+dodges*2)+"px 0 #c2185b, 0 "+(14+dodges*4)+"px "+(30+dodges*6)+"px rgba(214,51,132,.4)";
    var w=no.offsetWidth*scale, h=no.offsetHeight*scale;
    var maxX=Math.max(8, window.innerWidth-w-16), maxY=Math.max(8, window.innerHeight-h-16);
    var nx,ny,tries=0, oldX=parseFloat(no.style.left)||0, oldY=parseFloat(no.style.top)||0;
    do{ nx=8+Math.random()*maxX; ny=8+Math.random()*maxY; tries++; }
    while(tries<14 && Math.abs(nx-oldX)<120 && Math.abs(ny-oldY)<120);
    no.style.left=nx+"px"; no.style.top=ny+"px";
    taunt(T.s5.taunts[Math.min(dodges-1, T.s5.taunts.length-1)]);
    if(dodges>=MAX){
      gone=true;
      no.style.pointerEvents="none"; no.style.opacity="0";
      no.style.transform="scale(0.02) rotate(720deg)";
      setTimeout(function(){
        no.style.display="none";
        taunt(T.s5.goneTaunt);
        yes.style.transform="scale(2.8)";
      },520);
    }
  }
  ["mouseenter","mouseover","pointerdown","pointerenter","touchstart","click","focus"].forEach(function(ev){
    no.addEventListener(ev, flee, {passive:false});
  });
  yes.addEventListener("click",function(){ show("s6"); });

  document.getElementById("again").addEventListener("click",function(){
    dodges=0; scale=1; yScale=1; gone=false; ranLoader=false;
    no.className=""; no.style.cssText=""; no.style.display="";
    yes.style.transform=""; yes.style.boxShadow=""; taunt("");
    document.getElementById("barFill").style.width="0";
    document.getElementById("afterLoad").style.display="none";
    show("s0");
  });

  /* ---------- confetti ---------- */
  var cv=document.getElementById("confetti"), ctx=cv.getContext("2d"), parts=[], raf=null;
  function size(){ cv.width=window.innerWidth; cv.height=window.innerHeight; }
  size(); window.addEventListener("resize",size);
  function party(){
    parts=[];
    for(var i=0;i<95;i++){
      parts.push({x:Math.random()*cv.width,y:-40-Math.random()*cv.height,s:16+Math.random()*22,
        vy:1.6+Math.random()*3.2,vx:(Math.random()-.5)*1.6,r:Math.random()*6.28,vr:(Math.random()-.5)*.14,
        g:T.confetti[Math.floor(Math.random()*T.confetti.length)]});
    }
    if(!raf) tick();
  }
  function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    var live=0;
    for(var i=0;i<parts.length;i++){
      var p=parts[i];
      p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      if(p.y<cv.height+60) live++;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.font=p.s+"px serif"; ctx.textAlign="center"; ctx.fillText(p.g,0,0);
      ctx.restore();
    }
    if(live>0){ raf=requestAnimationFrame(tick); } else { ctx.clearRect(0,0,cv.width,cv.height); raf=null; }
  }
})();
</script>
</body>
</html>
